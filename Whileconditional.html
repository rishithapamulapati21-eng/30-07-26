<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<device-width>, initial-scale=1.0">
    <title>whilecondition</title>
</head>
<body style="background-color: hsl(115, 70%, 53%); text-align: center; padding: 20px;">
    <script>
        let i=1;
        while(i<10){
            document.write(i +"<br>");
            i++;
        }
    </script>
</body>
</html>
